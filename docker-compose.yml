services:
  postgres:
    image: postgres:16-alpine
    container_name: paggo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paggo
      POSTGRES_USER: paggo
      POSTGRES_PASSWORD: paggo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - paggo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paggo -d paggo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paggo_pgdata:
